<!DOCTYPE html>
<html lang="ru" class="popup-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memory Nap Tabs</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="popup dark">
  <div class="aurora" aria-hidden="true"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none">
            <rect x="3" y="3" width="26" height="26" rx="8" fill="url(#brandGrad)" opacity="0.22"></rect>
            <rect x="3.5" y="3.5" width="25" height="25" rx="7.5" stroke="url(#brandGrad)" stroke-width="1.4"></rect>
            <path d="M22 17.4A7.2 7.2 0 0 1 13.6 9 7.6 7.6 0 1 0 22 17.4Z" fill="url(#brandGrad)"></path>
            <path d="M9 24h14" stroke="url(#brandGrad)" stroke-width="1.6" stroke-linecap="round"></path>
            <defs>
              <linearGradient id="brandGrad" x1="0" y1="0" x2="32" y2="32">
                <stop offset="0%" stop-color="#2ff2b3"></stop>
                <stop offset="55%" stop-color="#4d7cff"></stop>
                <stop offset="100%" stop-color="#a06bff"></stop>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="brand-text">
          <strong>Memory Nap</strong>
          <small id="modeChip">Chrome</small>
        </span>
      </div>
      <div class="topbar-tools">
        <div class="ram-pill" id="ramPill" title="Свободная оперативная память системы">
          <span class="ram-dot" aria-hidden="true"></span>
          <span id="ramPillText">—</span>
        </div>
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Переключить тему"></button>
        <button class="icon-btn" id="openOptions" type="button" aria-label="Открыть настройки"></button>
      </div>
    </header>

    <main class="scroll" id="scrollArea">
      <section class="card hero">
        <div class="hero-copy">
          <p class="eyebrow">Освобождено сейчас · оценка</p>
          <p class="hero-value" id="freedNow">0 МБ</p>
          <p class="hero-sub" id="heroSub">Загружаем состояние вкладок…</p>
          <div class="hero-meter" id="heroMeter">
            <div class="meter-head"><span>Оперативная память системы</span><span id="ramText">—</span></div>
            <div class="meter-track"><div class="meter-fill" id="ramFill" style="width:0%"></div></div>
          </div>
        </div>
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#2ff2b3"></stop>
                <stop offset="55%" stop-color="#4d7cff"></stop>
                <stop offset="100%" stop-color="#a06bff"></stop>
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="60" cy="60" r="50"></circle>
            <circle class="ring-progress" id="ringProgress" cx="60" cy="60" r="50"></circle>
          </svg>
          <span class="ring-label"><b id="ringPercent">0%</b><small>спят</small></span>
        </div>
      </section>

      <section class="profile-strip" id="profileStrip" role="group" aria-label="Профиль нагрузки"></section>

      <section class="card timer-card">
        <div class="timer-head">
          <div>
            <p class="eyebrow">Автоусыпление</p>
            <p class="timer-note" id="timerNote">Через 20 минут простоя</p>
          </div>
          <div id="timerStepper"></div>
        </div>
        <div id="timerSlider"></div>
      </section>

      <section class="stat-grid">
        <article class="card stat"><span>Открыто</span><strong id="totalTabs">0</strong></article>
        <article class="card stat ready"><span>Готовы ко сну</span><strong id="readyTabs">0</strong></article>
        <article class="card stat protected"><span>Под защитой</span><strong id="protectedTabs">0</strong></article>
      </section>

      <section class="card panel">
        <div class="section-head">
          <h2>Освобождено по дням</h2>
          <span class="hint" id="weekTotal">0 МБ</span>
        </div>
        <svg class="chart" id="historyChart" viewBox="0 0 320 112" role="img" aria-label="График освобождённой памяти за неделю"></svg>
      </section>

      <section class="card panel">
        <div class="section-head">
          <h2>Топ доменов</h2>
          <span class="hint" id="domainsHint">0</span>
        </div>
        <div class="domain-list" id="domainList"></div>
      </section>

      <section class="card panel manager">
        <div class="section-head">
          <h2>Менеджер вкладок</h2>
          <span class="hint" id="tabsHint">0</span>
        </div>
        <div class="search-row">
          <span class="search-icon" aria-hidden="true"></span>
          <input type="search" id="tabSearch" placeholder="Поиск по названию или домену  ( / )" aria-label="Поиск вкладки" />
          <select id="sortSelect" aria-label="Сортировка">
            <option value="idle">По простою</option>
            <option value="memory">По памяти</option>
            <option value="title">По названию</option>
            <option value="domain">По домену</option>
          </select>
        </div>
        <div class="chip-row filters" id="filterChips" role="group" aria-label="Фильтр вкладок"></div>
        <div class="bulk-bar" id="bulkBar" hidden></div>
        <div class="tabs-list" id="tabsList"></div>
        <button class="btn ghost small more-btn" id="moreBtn" type="button" hidden>Показать ещё</button>
      </section>
    </main>

    <footer class="dock">
      <div class="dock-actions">
        <button class="btn primary" id="sleepCurrent" type="button" title="Alt+Shift+S">Усыпить текущую</button>
        <button class="btn" id="sleepInactive" type="button" title="Alt+Shift+A">Усыпить неактивные</button>
        <button class="btn blue" id="wakeAll" type="button" title="Alt+Shift+W">Разбудить все</button>
        <button class="btn" id="saveSession" type="button">Сохранить сессию</button>
      </div>
      <p class="status" id="statusText" role="status">Готово</p>
    </footer>
  </div>

  <div class="toast-layer" id="toastLayer"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
